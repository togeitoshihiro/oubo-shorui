<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>応募者の採用と書類</title>
<style>
  :root { --g:#127a3c; --gd:#0b5a2b; --g2:#1f9d55; --gl:#e7f5ec; --bg:#f3f5f4; --card:#fff; --ink:#15181b; --sub:#6b7178; --line:#e3e7e5;
          --warn:#c0362c; --warnbg:#fdeeec; --note:#fff6e0; --amber:#a45c00; --shadow:0 1px 2px rgba(16,24,20,.06), 0 4px 14px rgba(16,24,20,.06); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  body { font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%; }
  .wrap { max-width:560px; margin:0 auto; padding:0 14px 48px; }
  .appbar { position:sticky; top:0; z-index:6; margin:0 -14px 10px; padding:12px 16px 12px; background:linear-gradient(135deg, var(--gd), var(--g2)); color:#fff; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .appbar .ttl { font-weight:800; font-size:17px; letter-spacing:.02em; }
  .appbar .who2 { font-size:13px; opacity:.9; }
  .appbar button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:999px; padding:6px 12px; font-size:13px; font-family:inherit; cursor:pointer; }
  .seg { display:flex; background:#e4e9e6; border-radius:12px; padding:4px; gap:4px; margin:4px 0 12px; }
  .seg button { flex:1; border:0; background:transparent; border-radius:9px; padding:9px 4px; font-family:inherit; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .seg .n { display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:999px; background:#d3dbd7; color:var(--ink); font-size:12px; }
  .seg button.on .n { background:var(--g); color:#fff; }
  .bar { position:sticky; top:0; background:var(--bg); padding:10px 0 8px; z-index:5; }
  .who { font-size:14px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; }
  .who a { color:var(--g); text-decoration:none; font-weight:700; }
  .prog { height:8px; background:#e1e7e3; border-radius:6px; overflow:hidden; margin-top:6px; }
  .prog > i { display:block; height:100%; background:linear-gradient(90deg, var(--g), var(--g2)); width:0; transition:width .3s; }
  .count { font-size:13px; color:var(--sub); margin-top:2px; text-align:right; }
  h1 { font-size:21px; line-height:1.35; margin:10px 0 6px; letter-spacing:.01em; }
  h2 { font-size:15px; margin:18px 2px 8px; color:var(--sub); font-weight:700; letter-spacing:.04em; }
  p { margin:6px 0; }
  .sub { color:var(--sub); font-size:14px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin:12px 0; box-shadow:var(--shadow); }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px 12px; font-size:16px; font-weight:700; margin:8px 0; cursor:pointer; text-align:center; text-decoration:none; font-family:inherit; }
  .btn.main { background:var(--g); color:#fff; box-shadow:0 2px 8px rgba(18,122,60,.28); }
  .btn.main:active { transform:translateY(1px); }
  .btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn.ghost { background:transparent; color:var(--g); font-size:14px; font-weight:700; padding:8px; margin:2px 0; }
  .btn.danger { background:#fff; color:var(--warn); border:1.5px solid #f2c7c2; }
  .row2 { display:flex; gap:8px; } .row2 > * { flex:1; margin:4px 0 !important; }
  .pic { width:100%; aspect-ratio: 4/3; background:#eaf0ec; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .pic img { width:100%; height:100%; object-fit:contain; background:#1d1f1e; }
  .pic svg { width:55%; height:auto; }
  .warn { background:var(--warnbg); color:var(--warn); border-radius:12px; padding:10px 12px; font-weight:700; font-size:14px; }
  .note { background:var(--note); border-radius:12px; padding:10px 12px; font-size:14px; }
  .checks { background:#fff; border-radius:12px; padding:10px 14px; margin:10px 0; box-shadow:var(--shadow); font-size:15px; }
  .checks b { font-size:13px; color:var(--sub); }
  .checks ul { margin:4px 0 0; padding-left:1.2em; }
  ul.list { list-style:none; padding:0; margin:6px 0; }
  ul.list li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:15px; }
  ul.list li:last-child { border-bottom:0; }
  ul.list li b { white-space:nowrap; font-size:13px; }
  .mark-ok { color:var(--g); } .mark-no { color:var(--warn); } .mark-later { color:var(--amber); }
  .person { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:0; border-radius:16px; padding:12px 14px; margin:8px 0; font-family:inherit; color:var(--ink); cursor:pointer; box-shadow:var(--shadow); }
  .person:active { transform:scale(.995); }
  .av { flex:0 0 40px; height:40px; border-radius:50%; background:var(--gl); color:var(--g); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  .person .body { flex:1; min-width:0; }
  .person .nm { font-weight:800; font-size:16px; }
  .person .meta { font-size:12.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person .last { font-size:12.5px; color:var(--ink); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85; }
  .person .chev { color:#b6bdb9; font-size:20px; }
  .chips { margin-top:4px; display:flex; flex-wrap:wrap; gap:4px; }
  .tag { display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:999px; background:#eef1ef; color:var(--sub); font-weight:700; }
  .tag.hire { background:var(--gl); color:var(--g); }
  .tag.doing { background:var(--note); color:var(--amber); }
  .tag.ng { background:var(--warnbg); color:var(--warn); }
  .tag.blue { background:#e8f0fd; color:#2459c6; }
  input.search { width:100%; font-size:15px; padding:11px 14px; border-radius:12px; border:0; background:#fff; box-shadow:var(--shadow); font-family:inherit; margin:6px 0; }
  .spin { width:40px; height:40px; border:4px solid #cfe5d4; border-top-color:var(--g); border-radius:50%; animation:sp 1s linear infinite; margin:30px auto 10px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .center { text-align:center; }
  .hide { display:none !important; }
  input[type=file] { display:none; }
  .big-check { font-size:52px; text-align:center; color:var(--g); line-height:1; margin:18px 0 6px; }
  .hero { display:flex; gap:12px; align-items:center; }
  .hero .av { flex-basis:52px; height:52px; font-size:20px; }
  .hero .nm { font-size:20px; font-weight:800; line-height:1.3; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-top:12px; }
  .grid div { font-size:14px; } .grid span { display:block; font-size:11.5px; color:var(--sub); }
  .acts { display:flex; gap:8px; margin-top:12px; }
  .acts a, .acts button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; padding:12px; font-weight:700; font-size:15px; text-decoration:none; border:0; font-family:inherit; cursor:pointer; }
  .acts .call { background:linear-gradient(135deg, var(--gd), var(--g2)); color:#fff; box-shadow:0 4px 12px rgba(18,122,60,.25); }
  .acts .sms { background:#e8f0fd; color:#2459c6; }
  .acts a:active { transform:scale(.97); }
  .ai { display:inline-flex; width:20px; height:20px; } .ai svg { width:100%; height:100%; }
  .hist { margin:8px 0 0; padding:0; list-style:none; font-size:13.5px; }
  .hist li { padding:6px 0 6px 18px; position:relative; border-bottom:1px dashed var(--line); }
  .hist li:before { content:''; position:absolute; left:4px; top:13px; width:6px; height:6px; border-radius:50%; background:var(--warn); }
  .hist li:before { background:#9aa39e !important; }
  .modal { position:fixed; inset:0; background:rgba(10,20,15,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal .sheet { background:#fff; width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:20px 16px 28px; box-shadow:0 -6px 24px rgba(0,0,0,.15); }
  .fld { margin:10px 0; }
  .fld label { display:block; font-size:12.5px; color:var(--sub); margin-bottom:4px; font-weight:700; letter-spacing:.03em; }
  .frow { display:flex; gap:8px; align-items:stretch; }
  .frow input, .frow select, .frow textarea { flex:1; min-width:0; font-size:16px; padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); font-family:inherit; background:#fbfcfb; color:var(--ink); }
  .frow input:focus, .frow select:focus, .frow textarea:focus { outline:none; border-color:var(--g2); background:#fff; }
  .mic { position:relative; flex:0 0 44px; height:44px; align-self:center; border:0; border-radius:50%; background:var(--gl); color:var(--g); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; transition:background .2s, color .2s, transform .1s; }
  .mic:active { transform:scale(.94); }
  .mic svg { width:20px; height:20px; }
  .mic.txt { border-radius:12px; flex-basis:56px; font-size:13px; font-weight:700; font-family:inherit; }
  .mic.on { background:var(--warn); color:#fff; }
  .mic.on::after { content:''; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--warn); animation:ring 1.2s ease-out infinite; }
  @keyframes ring { from { transform:scale(.85); opacity:.9; } to { transform:scale(1.35); opacity:0; } }
  .voice { display:flex; align-items:center; gap:12px; width:100%; border:0; border-radius:14px; padding:12px 14px; margin:6px 0 4px; cursor:pointer; font-family:inherit; text-align:left;
           background:linear-gradient(135deg, var(--gd), var(--g2)); color:#fff; box-shadow:0 4px 14px rgba(18,122,60,.25); }
  .voice .vi { position:relative; flex:0 0 40px; height:40px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; }
  .voice .vi svg { width:20px; height:20px; }
  .voice b { display:block; font-size:15px; } .voice small { font-size:12px; opacity:.85; }
  .voice.on { background:linear-gradient(135deg, #a52a21, var(--warn)); }
  .voice.on .vi::after { content:''; position:absolute; inset:-5px; border-radius:50%; border:2px solid #fff; animation:ring 1.2s ease-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .saved { font-size:11.5px; margin-left:6px; font-weight:700; } .saved.ok { color:var(--g); } .saved.ng { color:var(--warn); }
  #qr { display:flex; justify-content:center; margin:14px 0; }
  #qr img, #qr canvas { width:230px !important; height:230px !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar hide" id="bar">
    <div class="who"><span id="whoName"></span><a href="#" id="toList" class="hide" onclick="backToList();return false;">← 応募者の一覧へ</a></div>
    <div class="prog"><i id="progi"></i></div><div class="count" id="count"></div>
  </div>
  <div id="view"><div class="spin"></div><p class="center sub">読み込んでいます…</p></div>
</div>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="pick" accept="image/*">

<script>
var API = 'https://script.google.com/macros/s/AKfycbxXqXGMgSnxYJre2Lpq8D7lV5ksrwsQl8tC4yrOCl5EN2Z_IRVb45DH_fQrS73eaLnGUw/exec';
var Q = new URLSearchParams(location.search);
var TOKEN = (Q.get('t') || '').trim();
var STAFF = (Q.get('staff') || '').trim();
try { if (STAFF) localStorage.setItem('staffKey', STAFF); else STAFF = localStorage.getItem('staffKey') || ''; } catch (e) {}
var S = null, steps = [], cur = 0, page = 1, shot = null, LIST = null;
var view = document.getElementById('view');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function run(fn, args, ok, ng) {
  ng = ng || function(e){ showError(e); };
  fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok) { ok && ok(j.result); } else { ng(j && j.error); } })
    .catch(function(e){ ng(e); });
}
function showError() {
  view.innerHTML = '<h1>うまくいきませんでした</h1><p>電波のよいところで、もう一度おしてください。</p>' +
    '<button class="btn main" onclick="location.reload()">もう一度ためす</button>';
}
function loading(msg) { view.innerHTML = '<div class="spin"></div><p class="center sub">' + (msg || '読み込んでいます…') + '</p>'; }
function setUrl(params) { history.replaceState(null, '', location.pathname + (params ? '?' + params : '')); }

// ===== 担当者の一覧 =====
// 採用候補：採用可否が空で、辞退・年齢制限などでない人。押すと詳しい情報と「採用」「不採用」
// 採用した人：採用可否が「採用」の人（と書類を撮りかけの人）。押すと書類を撮る
var MODE = 'cand';
try { MODE = localStorage.getItem('staffMode') || 'cand'; } catch (e) {}
var OUT = /年齢制限|辞退|音信不通|空き無し|応募課金|契約/;
function isHired(x) { return /^採用/.test(x.hire) || !!x.token; }
function isRejected(x) { return /不採用/.test(x.hire); }
var RECENT_DAYS = 45; // 採用候補は、応募日がこの日数以内の人だけ
var NEW_DAYS = 7;     // いつもの一覧に出す「未対応」は、応募日がこの日数以内の人
function daysAgo(s) { var m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if (!m) return 9999; return Math.floor((Date.now() - new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime()) / 86400000); }
function isCand(x) { return !isHired(x) && !isRejected(x) && !OUT.test(x.state) && daysAgo(x.asked) <= RECENT_DAYS; }
function talked(x) { return !!x.interview || /検討中|返事待ち|案件探し/.test(x.state); }
// まだ対応していない人：シートに入力されただけ（連絡状態が空かSMS送信済みで、面談の内容もまだ）
function noReachOnly(v) { return !String(v || '').split(/\n|　/).filter(function(l){ return l.trim() && !/電話つながらず/.test(l); }).length; }
function staffSurname(n) { n = String(n || ''); return /一真|高橋|髙橋/.test(n) ? '高橋' : /赤倉/.test(n) ? '赤倉' : /広瀬/.test(n) ? '広瀬' : n; }
function staffLabel(n) { var s = staffSurname(n); return s ? s + 'さん' : '担当者'; }
function smsLine(x) {
  var out = [];
  if (x.aiSms) out.push('AIがSMS送信 ' + aiSmsLabel(x).split(' ')[0]);
  else if (/SMS送信済み/.test(x.state)) out.push(staffLabel(x.tanto) + 'がSMS送信');
  var ss = staffSmsList(x);
  if (ss.length) { var l = ss[ss.length - 1], m = l.match(/^(\S+)\s*SMS送信（(.+?)）/); out.push(m ? staffLabel(m[2]) + 'がSMS送信 ' + m[1] : l); }
  return out.join(' · ');
}
function staffSmsList(x) { return String(x.other || '').split(/\n/).filter(function(l){ return /SMS送信（/.test(l); }).map(function(l){ return l.trim(); }); }
function aiSmsLabel(x) { return x.aiSms ? String(x.aiSms).replace(/^\d{4}-(\d{2})-(\d{2})/, function(_, m, d){ return Number(m) + '/' + Number(d); }) : ''; }
function contactLog(x) {
  var out = [];
  if (x.aiSms) out.push({ k: 'ai', t: aiSmsLabel(x) + ' AIがSMS送信（応募時）' });
  else if (/SMS送信済み/.test(x.state)) out.push({ k: 'staff', t: staffLabel(x.tanto) + 'がSMS送信（日時の記録なし）' });
  String(x.other || '').split(/\n/).forEach(function(l){ l = l.trim(); if (/電話つながらず/.test(l)) out.push({ k: 'ng', t: l }); else if (/SMS送信（/.test(l)) out.push({ k: 'staff', t: l }); });
  return out;
}
function noReachList(x) { return String(x.other || '').split(/\n/).filter(function(l){ return /電話つながらず/.test(l); }).map(function(l){ return l.trim(); }); }
function lastNote(x) { var ls = String(x.other || '').split(/\n/).map(function(l){ return l.trim(); }).filter(String); return ls.length ? ls[ls.length - 1] : ''; }
function noReachCount(x) { return (String(x.other || '').match(/電話つながらず/g) || []).length; }
function untouched(x) { return (!x.state || /^SMS送信済み$/.test(x.state)) && !x.interview && !x.area && !x.job && !x.exp && !x.prev && !String(x.other || '').trim() && !x.first; }
function dkey(s) { var m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); return m ? Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]) : 0; }

var ON_HOME = false;
function cacheKey() { return 'staffList_' + STAFF; }
// テスト用の応募者（シートには書かない。赤倉くん・広瀬さんの一覧のいちばん上に出す）
function testPerson() {
  var d = new Date(), today = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  return { test: true, no: '0', name: 'テスト　花子', kana: 'テスト　ハナコ', sex: '女性', asked: today, interview: '', state: '', media: 'テスト',
    pref: '東京都', city: '豊島区', tanto: '赤倉', tel: '00000000000', hire: '', age: '30', first: '', pay: '', home: '', area: '', job: '', car: '',
    exp: '', prev: '', other: '', sheet: 'test', label: 'テスト用', tab: '', row: 0, token: '', done: 0 };
}
function useList(r) {
  LIST = r;
  if ((LIST.staff === '赤倉' || LIST.staff === '広瀬') && !LIST.items.some(function(x){ return x.test; })) {
    var keep = null; try { keep = JSON.parse(localStorage.getItem('testPerson') || 'null'); } catch (e) {}
    LIST.items.unshift(keep || testPerson());
  }
  LIST.items.forEach(function(x, i){ x.i = i; });
}
function resetTest() { try { localStorage.removeItem('testPerson'); } catch (e) {} var t = testPerson(); var j = LIST.items.findIndex(function(y){ return y.test; }); t.i = j; LIST.items[j] = t; showDetail(j); }
function saveTest(x) { try { localStorage.setItem('testPerson', JSON.stringify(x)); } catch (e) {} }
function showStaffList(reload) {
  document.getElementById('bar').classList.add('hide');
  ON_HOME = true;
  if (LIST && !reload) { renderHome(); return; }
  // 前に読んだ一覧があれば、まずそれを出して、新しい一覧は裏で読む
  var shown = false;
  if (!LIST) { try { var c = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); if (c && c.items) { useList(c); renderHome(true); shown = true; } } catch (e) {} }
  else { renderHome(true); shown = true; }
  if (!shown) loading('応募者の一覧を読み込んでいます…');
  run('staffList', [STAFF], function(r) {
    if (!r || !r.ok) { if (!shown) view.innerHTML = '<h1>このリンクでは開けません</h1><p>担当者用のリンクを、もう一度開いてください。</p>'; return; }
    try { localStorage.setItem(cacheKey(), JSON.stringify({ ok: r.ok, staff: r.staff, options: r.options, at: r.at, items: r.items.filter(function(x){ return !x.test; }) })); } catch (e) {}
    useList(r);
    if (!shown) { renderHome(); return; }
    if (ON_HOME && document.getElementById('homeMark')) { var ae = document.activeElement; if (ae && ae.tagName === 'INPUT') { var m = document.getElementById('upd'); if (m) m.textContent = ''; } else renderHome(); }
  }, function(e) { if (!shown) showError(e); else { var m = document.getElementById('upd'); if (m) m.textContent = '（最新の読み込みに失敗。「読み込み直す」を押してください）'; } });
}
function setMode(m) { MODE = m; try { localStorage.setItem('staffMode', m); } catch (e) {} renderHome(); }
function personBtn(x, onclick) {
  var chips = '';
  if (x.test) chips += '<span class="tag doing">テスト用</span>';
  if (/^採用/.test(x.hire)) chips += '<span class="tag hire">採用</span>';
  if (isRejected(x)) chips += '<span class="tag ng">不採用</span>';
  if (x.token) chips += '<span class="tag doing">書類 ' + x.done + '枚</span>';
  var nr = noReachList(x);
  if (nr.length) chips += '<span class="tag ng">📵 つながらず ' + nr.length + '回</span>';
  if (x.state && !/^SMS送信済み$/.test(x.state)) chips += '<span class="tag blue">' + esc(x.state) + '</span>';
  if (x.interview) chips += '<span class="tag">面接 ' + esc(String(x.interview).replace(/^\d{4}\//, '')) + '</span>';

  view.innerHTML = '<h1>' + esc(x.name) + 'さんを不採用にしますか？</h1><p>採用候補の一覧から消えます（「不採用にした人を見る」から、もとにもどせます）。</p>' +
    '<button class="btn main" style="background:var(--warn);box-shadow:none" onclick="decide(' + i + ',\'不採用\')">不採用にする</button>' +
    '<button class="btn sec" onclick="showDetail(' + i + ')">やめる</button>';
}
function decide(i, value) {
  var x = LIST.items[i];
  if (CUR === x && document.getElementById('f_other')) { var pend = collectFields(x); if (Object.keys(pend).length) { writeFields(x, pend, function(ok){ if (ok) decide(i, value); }); return; } }
  if (x.test) {
    x.hire = value; saveTest(x);
    if (value === '採用') view.innerHTML = '<div class="big-check">✓</div><h1 class="center">' + esc(x.name) + 'さんを<br>採用にしました</h1><p class="center sub">（テストなので、シートには書きません）</p><button class="btn main" onclick="openPerson(' + i + ')">このまま書類を撮る</button><button class="btn sec" onclick="renderHome()">一覧にもどる</button>';
    else renderHome();
    return;
  }
  loading('記録しています…');
  run('setHire', [STAFF, x.sheet, x.tab, x.row, x.no, x.name, value], function(r) {
    if (!r || !r.ok) { view.innerHTML = '<h1>記録できませんでした</h1><p>もう一度ためしてください。</p><button class="btn main" onclick="showDetail(' + i + ')">もどる</button>'; return; }
    x.hire = value;
    try { localStorage.setItem(cacheKey(), JSON.stringify({ ok: true, staff: LIST.staff, options: LIST.options, at: LIST.at, items: LIST.items.filter(function(y){ return !y.test; }) })); } catch (e) {}
    if (value === '採用') {
      view.innerHTML = '<div class="big-check">✓</div><h1 class="center">' + esc(x.name) + 'さんを<br>採用にしました</h1><p class="center sub">「採用した人」の一覧に入りました。</p>' +
        '<button class="btn main" onclick="openPerson(' + i + ')">このまま書類を撮る</button><button class="btn sec" onclick="renderHome()">採用候補の一覧にもどる</button>';
    } else {
      renderHome();
    }
  });
}
function openPerson(i) {
  ON_HOME = false;
  var x = LIST.items[i];
  if (x.test) x.token = '1d4ddaccaa';
  if (x.token) { TOKEN = x.token; setUrl('t=' + TOKEN); startPerson(); return; }
  loading('準備しています…');
  run('staffOpen', [STAFF, x.sheet, x.tab, x.row, x.no], function(r) {
    if (!r || !r.ok) { showError(); return; }
    x.token = r.token; TOKEN = r.token; setUrl('t=' + TOKEN); startPerson();
  });
}
function backToList() { TOKEN = ''; S = null; steps = []; setUrl(''); MODE = 'hired'; showStaffList(true); }

// ===== 1人分の書類 =====
function setBar() {
  var bar = document.getElementById('bar');
  bar.classList.remove('hide');
  document.getElementById('whoName').textContent = S ? S.name + 'さん' + (S.no ? '（' + S.no + '）' : '') : '';
  document.getElementById('toList').classList.toggle('hide', !STAFF);
  if (!steps.length) { document.getElementById('progi').style.width = '0'; document.getElementById('count').textContent = ''; return; }
  var n = steps.filter(function(d){ return S.done.indexOf(d.key) >= 0 || S.later.indexOf(d.key) >= 0; }).length;
  document.getElementById('progi').style.width = Math.round(n / steps.length * 100) + '%';
  document.getElementById('count').textContent = n + ' / ' + steps.length + ' おわり';
}
function needSteps() { return S.docs.filter(function(d){ return !d.car || S.car === '持込'; }); }
function firstTodo() {
  for (var i = 0; i < steps.length; i++) { var k = steps[i].key; if (S.done.indexOf(k) < 0 && S.later.indexOf(k) < 0) return i; }
  return -1;
}
function icon(kind) {
  if (kind === 'card') return '<svg viewBox="0 0 200 130"><rect x="4" y="4" width="192" height="122" rx="12" fill="#fff" stroke="#1a7f37" stroke-width="5"/><rect x="18" y="26" width="46" height="60" rx="4" fill="#cfe5d4"/><rect x="78" y="28" width="100" height="10" rx="5" fill="#cfe5d4"/><rect x="78" y="50" width="86" height="10" rx="5" fill="#cfe5d4"/><rect x="78" y="72" width="94" height="10" rx="5" fill="#cfe5d4"/><rect x="18" y="100" width="160" height="10" rx="5" fill="#cfe5d4"/></svg>';
  return '<svg viewBox="0 0 150 200"><rect x="4" y="4" width="142" height="192" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="5"/><rect x="40" y="22" width="70" height="12" rx="6" fill="#cfe5d4"/><g fill="#e3ece5"><rect x="20" y="52" width="110" height="9" rx="4"/><rect x="20" y="72" width="110" height="9" rx="4"/><rect x="20" y="92" width="96" height="9" rx="4"/><rect x="20" y="112" width="110" height="9" rx="4"/><rect x="20" y="132" width="80" height="9" rx="4"/></g><circle cx="112" cy="166" r="14" fill="none" stroke="#e08a8a" stroke-width="4"/></svg>';
}

function startPerson() {
  loading();
  run('getState', [TOKEN], function(s) {
    if (!s || !s.ok) { view.innerHTML = '<h1>この応募者が見つかりません</h1>' + (STAFF ? '<button class="btn main" onclick="backToList()">応募者の一覧へ</button>' : '<p>担当者用のリンクから開いてください。</p>'); return; }
    S = s;
    if (!S.lineUrl) S.lineUrl = 'https://line.me/R/ti/p/@284vqmzj'; // 軽貨物配送本舗DR連絡網
    if (S.car) { steps = needSteps(); setBar(); showList(true); } else { setBar(); askCar(); }
  });
}

function askCar() {
  view.innerHTML =
    '<h1>' + esc(S.name) + 'さんの書類</h1>' +
    '<div class="card"><p>面談で受け取った書類を、1枚ずつ撮ってアップロードします。撮るたびに、確認することが出ます。</p></div>' +
    '<h2>この方がお仕事で使う車は？</h2>' +
    '<button class="btn main" onclick="chooseCar(\'持込\')">自分の車（持込）</button>' +
    '<button class="btn main" onclick="chooseCar(\'リース\')">会社の車を借りる（リース）</button>';
}
function chooseCar(c) { S.car = c; run('setCar', [TOKEN, c], function(){}); steps = needSteps(); setBar(); goNext(); }

function goNext() { var i = firstTodo(); if (i < 0) { showFinish(); return; } cur = i; page = 1; showDoc(); }

function showDoc() {
  var d = steps[cur];
  setBar();
  var chk = (d.check && d.check.length) ? '<div class="checks"><b>確認すること</b><ul>' + d.check.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' : '';
  var laterBtn = d.later ? '<button class="btn sec" onclick="askLater()">まだ受けていない（あとで撮る）</button>' : '';
  view.innerHTML =
    '<h1>' + esc(d.name) + (page > 1 ? '<br><span class="sub">（' + page + '枚目）</span>' : '') + '</h1>' +
    '<div class="pic">' + icon(d.icon) + '</div>' + chk +
    '<p class="sub">明るいところで、書類の四すみが入るように撮ってください。</p>' +
    '<button class="btn main" onclick="openCam()">カメラで撮る</button>' + laterBtn +
    '<button class="btn ghost" onclick="openPick()">撮ってある写真からえらぶ</button>' +
    '<button class="btn ghost" onclick="showList(false)">書類の一覧を見る</button>';
}
function openCam() { var f = document.getElementById('cam'); f.value = ''; f.click(); }
function openPick() { var f = document.getElementById('pick'); f.value = ''; f.click(); }
document.getElementById('cam').addEventListener('change', onFile);
document.getElementById('pick').addEventListener('change', onFile);

function onFile(ev) {
  var file = ev.target.files && ev.target.files[0];
  if (!file) return;
  loading('写真を読みこんでいます…');
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function() {
    var max = 1800, w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var q = check(c), dataUrl = c.toDataURL('image/jpeg', 0.85);
    shot = { data: dataUrl.split(',')[1], mime: 'image/jpeg', url: dataUrl, q: q };
    URL.revokeObjectURL(url); showShot();
  };
  img.onerror = function() { view.innerHTML = '<h1>写真を読みこめませんでした</h1><button class="btn main" onclick="showDoc()">もう一度撮る</button>'; };
  img.src = url;
}
function check(c) {
  var s = document.createElement('canvas'), w = 200, h = Math.round(200 * c.height / c.width);
  s.width = w; s.height = h; var x = s.getContext('2d'); x.drawImage(c, 0, 0, w, h);
  var d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h), sum = 0;
  for (var i = 0, j = 0; i < d.length; i += 4, j++) { g[j] = d[i] * .299 + d[i+1] * .587 + d[i+2] * .114; sum += g[j]; }
  var lap = 0, n = 0, ls = 0;
  for (var yy = 1; yy < h - 1; yy++) for (var xx = 1; xx < w - 1; xx++) { var k = yy * w + xx, v = 4 * g[k] - g[k-1] - g[k+1] - g[k-w] - g[k+w]; ls += v; lap += v * v; n++; }
  return { dark: sum / (w * h) < 70, blur: (lap / n - Math.pow(ls / n, 2)) < 60 };
}
function showShot() {
  var d = steps[cur], msg = '';
  if (shot.q.dark) msg = '<p class="warn">写真が暗いようです。明るいところで撮り直すと、きれいに写ります。</p>';
  else if (shot.q.blur) msg = '<p class="warn">写真がぼやけているようです。文字が読めるか確かめてください。</p>';
  var chk = (d.check && d.check.length) ? '<div class="checks"><b>確認すること</b><ul>' + d.check.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' : '';
  view.innerHTML = '<h1>この写真でよいですか？</h1><div class="pic"><img src="' + shot.url + '" alt=""></div>' + msg + chk +
    '<button class="btn main" onclick="send()">これでアップロード</button><button class="btn sec" onclick="showDoc()">撮り直す</button>';
}
function send(tries) {
  tries = tries || 0;
  var d = steps[cur];
  loading('アップロードしています…');
  if (!shot.sendId) shot.sendId = TOKEN + '_' + d.key + '_' + page + '_' + Date.now();
  run('uploadPhoto', [{ token: TOKEN, key: d.key, page: page, data: shot.data, mime: shot.mime, sendId: shot.sendId }], function() {
    if (S.done.indexOf(d.key) < 0) S.done.push(d.key);
    var li = S.later.indexOf(d.key); if (li >= 0) S.later.splice(li, 1);
    setBar();
    view.innerHTML = '<div class="big-check">✓</div><h1 class="center">アップロードしました</h1><p class="center">' + esc(d.name) + (page > 1 ? '（' + page + '枚目）' : '') + '</p>' +
      '<div class="card"><p>この書類は、ほかにも紙やページがありますか？</p><button class="btn sec" onclick="page++; showDoc()">ある（もう1枚撮る）</button></div>' +
      '<button class="btn main" onclick="goNext()">ない（つぎへ進む）</button>';
  }, function() {
    if (tries < 2) { setTimeout(function(){ send(tries + 1); }, 1500); return; }
    view.innerHTML = '<h1>アップロードできませんでした</h1><p>電波のよいところで、もう一度おしてください。</p><button class="btn main" onclick="send()">もう一度アップロード</button><button class="btn sec" onclick="showDoc()">撮り直す</button>';
  });
}
function askLater() {
  view.innerHTML = '<h1>あとで撮る</h1>' +
    '<div class="note"><p><b>健康診断・適性診断・安全管理者講習の3つがそろわないと、お仕事を始められません。</b></p><p>このことを、応募者にお伝えください。</p></div>' +
    '<p>受けたら、応募者の一覧からこの方を選んで、いつでも追加できます。</p>' +
    '<button class="btn main" onclick="laterOk()">伝えた（つぎへ）</button><button class="btn sec" onclick="showDoc()">もどる（いま撮る）</button>';
}
function laterOk() { var d = steps[cur]; if (S.later.indexOf(d.key) < 0) S.later.push(d.key); run('markLater', [TOKEN, d.key], function(){}); goNext(); }

function showList(resume) {
  setBar();
  var html = '<h1>' + esc(S.name) + 'さんの書類</h1><ul class="list">';
  steps.forEach(function(d) {
    var st = S.done.indexOf(d.key) >= 0 ? '<b class="mark-ok">✓ アップロード済み</b>' : S.later.indexOf(d.key) >= 0 ? '<b class="mark-later">あとで</b>' : '<b class="mark-no">まだ</b>';
    html += '<li><span>' + esc(d.name) + '</span>' + st + '</li>';
  });
  html += '</ul>';
  var todo = firstTodo();
  if (todo >= 0) html += '<button class="btn main" onclick="goNext()">' + (resume && (S.done.length || S.later.length) ? 'つづきを撮る' : '撮りはじめる') + '</button>';
  var laterIdx = steps.map(function(d, i){ return S.later.indexOf(d.key) >= 0 ? i : -1; }).filter(function(i){ return i >= 0; });
  if (laterIdx.length) html += '<button class="btn sec" onclick="cur=' + laterIdx[0] + ';page=1;showDoc()">「あとで」にした書類を撮る</button>';
  if (todo < 0) html += '<button class="btn main" onclick="showFinish()">さいごの画面へ</button>';
  html += '<button class="btn ghost" onclick="pickRedo()">撮り直す・追加する書類をえらぶ</button>';
  html += '<button class="btn ghost" onclick="askCar()">車（持込・リース）を変える</button>';
  view.innerHTML = html;
}
function pickRedo() {
  var html = '<h1>どの書類を撮りますか？</h1>';
  steps.forEach(function(d, i) { html += '<button class="btn sec" onclick="cur=' + i + ';page=1;showDoc()">' + esc(d.name) + (S.done.indexOf(d.key) >= 0 ? '（撮り直す・追加）' : '') + '</button>'; });
  html += '<button class="btn ghost" onclick="showList(false)">もどる</button>';
  view.innerHTML = html;
}

function showFinish() {
  setBar();
  run('finish', [TOKEN], function(){});
  var missing = steps.filter(function(d){ return S.done.indexOf(d.key) < 0; });
  var three = missing.filter(function(d){ return d.later; });
  var html = '';
  if (!missing.length) html += '<div class="big-check">✓</div><h1 class="center">書類はぜんぶアップロードしました</h1>';
  else {
    html += '<h1>アップロードはここまでです</h1><div class="card"><p><b>まだの書類</b></p><ul class="list">';
    missing.forEach(function(d){ html += '<li><span>' + esc(d.name) + '</span>' + (S.later.indexOf(d.key) >= 0 ? '<b class="mark-later">あとで</b>' : '<b class="mark-no">まだ</b>') + '</li>'; });
    html += '</ul>';
    if (three.length) html += '<p class="warn">健康診断・適性診断・安全管理者講習の3つがそろうまで、お仕事を始められません。応募者にお伝えください。</p>';
    if (firstTodo() >= 0) html += '<button class="btn sec" onclick="goNext()">まだの書類を撮る</button>';
    html += '</div>';
  }
  html += '<h2>さいごに、応募者にお願いすること</h2>';
  html += '<div class="card"><p><b>① 登録番号のフォームに答えてもらう</b></p><p class="sub">番号がない方も、全員に答えてもらいます。</p>' +
    (S.formChoice ? '<p class="mark-ok"><b>✓ ' + esc(S.formChoice) + '</b></p>' : '') +
    '<button class="btn main" onclick="showQr(\'form\')">QRコードを見せて、その場で答えてもらう</button>' +
    '<button class="btn sec" onclick="askSms()">あとでSMSで送る</button></div>';
  if (S.lineUrl) html += '<div class="card"><p><b>② LINE公式アカウントに登録してもらう</b></p><p class="sub">お仕事の連絡に使います。</p>' +
    '<button class="btn main" onclick="showQr(\'line\')">QRコードを見せて、登録してもらう</button></div>';
  html += STAFF ? '<button class="btn ghost" onclick="backToList()">応募者の一覧へもどる</button>' : '';
  view.innerHTML = html;
}
function showQr(kind) {
  var url = kind === 'line' ? S.lineUrl : S.formUrl;
  var title = kind === 'line' ? 'LINE公式アカウントの登録' : '登録番号のフォーム';
  view.innerHTML = '<h1>' + title + '</h1><p>応募者のスマホのカメラで、このQRコードを読み取ってもらってください。</p><div id="qr"></div>' +
    (kind === 'line' ? '<p class="sub">「追加」を押してもらえば登録できます。</p>' : '<p class="sub">番号がない方も、最後まで答えてもらってください。</p>') +
    '<button class="btn main" onclick="qrDone(\'' + kind + '\')">' + (kind === 'line' ? '登録してもらった' : '答えてもらった') + '</button>' +
    '<button class="btn ghost" onclick="showFinish()">もどる</button>';
  try { new QRCode(document.getElementById('qr'), { text: url, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { document.getElementById('qr').innerHTML = '<a class="btn sec" href="' + esc(url) + '" target="_blank" rel="noopener">リンクを開く</a>'; }
}
function qrDone(kind) {
  if (kind === 'form') { run('formChoice', [TOKEN, 'qr'], function(){}); S.formChoice = 'QRでその場で回答'; }
  showFinish();
}
function askSms() {
  view.innerHTML = '<h1>あとでSMSで送る</h1><p>登録番号のフォームのリンクを、あとで応募者にSMSでお送りします。</p>' +
    '<button class="btn main" onclick="smsOk()">SMSで送ってもらう</button><button class="btn ghost" onclick="showFinish()">もどる</button>';
}
function smsOk() { run('formChoice', [TOKEN, 'sms'], function(){}); S.formChoice = 'SMSで送る（あとで送ります）'; showFinish(); }

// ===== はじめ =====
if (TOKEN) startPerson();
else if (STAFF) showStaffList();
else view.innerHTML = '<h1>このページは担当者用です</h1><p>担当者用のリンクから開いてください。</p>';
</script>
